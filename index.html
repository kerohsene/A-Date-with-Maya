<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>A Date with Maya</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;1,9..144,400&family=Figtree:wght@400;600;700&display=swap">
<style>
:root{--ink:#1a0610;--cream:#fff3e6;--gold:#ffc46b;--rose:#e8445f;--serif:Fraunces,Georgia,serif;--sans:Figtree,system-ui,sans-serif;--glass:#2a0a16d9;--edge:#ffffff2b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--ink:#12040b;--glass:#220812de}}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--ink);color:var(--cream);font-family:var(--serif);overflow:hidden}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
#wrap{height:100%;display:grid;place-items:center}
#stage{position:relative;aspect-ratio:16/9;width:min(100vw,calc(100dvh*16/9));max-height:100%;overflow:hidden;background:#000;user-select:none;container-type:inline-size}
.bg{position:absolute;inset:0;transition:opacity .9s;background-size:cover}
#sprites{position:absolute;inset:0}
.sp{position:absolute;bottom:0;height:90%;transform:translateX(-50%);transition:left .5s,opacity .5s;animation:in .5s}
.sp svg{height:100%;filter:drop-shadow(0 0 2cqw #0007)}
.sp img{height:100%;width:auto;filter:drop-shadow(0 0 2cqw #0007)}
#art img{height:100%;width:auto;filter:drop-shadow(0 0 2.4cqw #2b0a1480)}
.miss{height:100%;width:18cqw;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.6cqw;text-align:center;border:2px dashed #ffffff88;background:#00000044;font:600 1.8cqw var(--sans);color:var(--cream)}
.miss small{font:400 1.4cqw var(--sans);opacity:.75}
#al{font:1.4cqw var(--sans);opacity:.7}
@keyframes in{from{opacity:0;transform:translate(-50%,16px)}}
#fx{position:absolute;inset:0;pointer-events:none;background:#fff;opacity:0}
#fx.go{animation:fl .5s}
@keyframes fl{0%{opacity:.85}100%{opacity:0}}
#stage.shake{animation:sh .4s}
@keyframes sh{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
button{font:600 1.6cqw var(--sans);color:var(--cream);background:#ffffff14;border:1px solid var(--edge);border-radius:99px;padding:.6cqw 1.4cqw;cursor:pointer;transition:background .15s,color .15s,transform .15s}
button:hover{background:#ffffff2e}
button.on{background:var(--gold);color:var(--ink);border-color:var(--gold)}
button:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
#box{position:absolute;left:5%;right:5%;bottom:4%;min-height:25%;padding:3.4cqw 3.6cqw 2.4cqw;background:linear-gradient(180deg,#3c1020d2,#1c0610ee);backdrop-filter:blur(10px);border:1px solid var(--edge);border-radius:1.6cqw;box-shadow:0 1.4cqw 4cqw #0009;cursor:pointer}
#name{position:absolute;top:-1.7cqw;left:3cqw;padding:.45cqw 1.8cqw;font:700 1.9cqw var(--sans);color:var(--ink);background:var(--rose);border-radius:99px;box-shadow:0 .5cqw 1.5cqw #0006}
#text{font-size:2.5cqw;line-height:1.6;min-height:5em;white-space:pre-wrap}
#next{position:absolute;right:2.2cqw;bottom:1.6cqw;width:1cqw;height:1cqw;background:var(--gold);transform:rotate(45deg);animation:bl 1.1s infinite;font-size:0}
@keyframes bl{50%{opacity:.25}}
#hud{position:absolute;top:1.4cqw;right:1.6cqw;display:flex;gap:.2cqw;padding:.4cqw;background:#1a0610a8;backdrop-filter:blur(8px);border:1px solid var(--edge);border-radius:99px}
#hud button{background:none;border-color:transparent;font-size:1.5cqw;padding:.55cqw 1.1cqw}
#hud button:hover{background:#ffffff24}#hud button.on{background:var(--gold)}
#choices{position:absolute;inset:0 14% 30% 14%;display:flex;flex-direction:column;justify-content:center;gap:1.4cqw}
#choices button{display:flex;align-items:center;gap:1.6cqw;font:400 2.4cqw var(--serif);padding:1.3cqw 2.2cqw;background:linear-gradient(90deg,#3c1020e6,#2a0a16e6);backdrop-filter:blur(8px);border-radius:1.4cqw;text-align:left}
#choices button:hover{background:var(--gold);color:var(--ink);transform:translateX(1cqw)}
#choices i{flex:none;display:grid;place-items:center;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--rose);color:var(--ink);font:700 1.7cqw var(--sans)}
#title{position:absolute;inset:0;overflow:hidden;background:linear-gradient(180deg,#2b0a14 0%,#6a1233 38%,#c4344a 72%,#ff9a6b 100%)}
#bk i{position:absolute;border-radius:50%;background:radial-gradient(circle,#ffd9a8,#ffb36b00 70%);opacity:var(--o);animation:dr 16s ease-in-out infinite alternate}
@keyframes dr{to{transform:translate(2cqw,-3cqw) scale(1.15)}}
#sun{position:absolute;left:68%;top:58%;width:72cqw;height:72cqw;transform:translate(-50%,-50%);background:radial-gradient(circle,#ffb36b99,#ff6b6b33 40%,transparent 68%)}
#art{position:absolute;left:68%;bottom:0;height:94%;transform:translateX(-50%);animation:rise 1.2s cubic-bezier(.2,.8,.2,1)}
#art svg{height:100%;filter:drop-shadow(0 0 2.4cqw #2b0a1480)}
@keyframes rise{from{opacity:0;transform:translate(-50%,3cqw)}}
#title .bgs{position:absolute;inset:0;width:100%;height:100%}
#tt{position:absolute;left:4cqw;top:6cqw;margin:0;max-width:30cqw;font:600 6.2cqw/.98 var(--serif);letter-spacing:-.01em;color:var(--cream);text-wrap:balance;text-shadow:0 .3cqw 2cqw #4a0614aa}
#tag{position:absolute;left:4.1cqw;top:20cqw;margin:0;font:italic 400 1.75cqw var(--serif);color:var(--cream);opacity:.85}
#menu{position:absolute;left:4cqw;top:29cqw;width:22cqw;display:flex;flex-direction:column}
#menu button{position:relative;background:none;border:0;border-bottom:1px solid #ffffff3a;border-radius:0;padding:1.1cqw 0;font:400 3.1cqw/1.2 var(--serif);color:var(--cream);text-align:left;transition:padding .2s,color .2s}
#menu button::before{content:"";position:absolute;left:0;top:50%;width:.9cqw;height:.9cqw;margin-top:-.45cqw;background:var(--gold);transform:rotate(45deg) scale(0);transition:transform .2s}
#menu button:hover,#menu button:focus-visible{background:none;padding-left:2.2cqw;color:#fff;outline:none}
#menu button:hover::before,#menu button:focus-visible::before{transform:rotate(45deg) scale(1)}
#title .ed{position:absolute;left:4cqw;bottom:2cqw;background:none;border:0;padding:0;font:600 1.45cqw var(--sans);color:var(--cream);opacity:.7;text-decoration:underline}
#title .ed:hover{background:none;opacity:1}
#panel{position:absolute;inset:0;background:#12040bf2;backdrop-filter:blur(14px);display:none;padding:3.4cqw 5cqw;flex-direction:column;gap:1.6cqw;z-index:5}
#panel.open{display:flex}
#panel h2{margin:0;font:600 3.4cqw var(--serif)}
#pbody{flex:1;overflow:auto;font-size:2cqw;line-height:1.6}
#pbody p{margin:0 0 1cqw}#pbody b{color:var(--gold);font-family:var(--sans)}
.slot{display:block;width:100%;text-align:left;margin-bottom:1cqw;font:400 2cqw var(--serif);padding:1.1cqw 1.8cqw;border-radius:1.2cqw}
textarea{width:100%;height:100%;resize:none;background:#ffffff0d;color:var(--cream);border:1px solid var(--edge);border-radius:1cqw;padding:1.2cqw;font:1.5cqw/1.5 ui-monospace,Menlo,Consolas,monospace}
label.r{display:flex;gap:1.4cqw;align-items:center;margin-bottom:1.4cqw}
input[type=range]{accent-color:var(--gold)}
#err{color:#ff9a9a;font:1.6cqw var(--sans)}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="wrap"><div id="stage">
  <div class="bg" id="b1"></div><div class="bg" id="b2" style="opacity:0"></div>
  <div id="sprites"></div><div id="fx"></div>
  <div id="choices"></div>
  <div id="box" style="display:none"><div id="name"></div><div id="text"></div><div id="next">▼</div></div>
  <div id="hud" style="display:none">
    <button data-a="back" title="Rollback (Backspace)">Back</button><button data-a="log">Log</button>
    <button data-a="auto" id="bauto">Auto</button><button data-a="skip" id="bskip">Skip</button>
    <button data-a="save">Save</button><button data-a="load">Load</button><button data-a="set">Settings</button><button data-a="quit">Title</button>
  </div>
  <div id="title">
    <div id="bk"></div><div id="sun"></div><div id="art"></div>
    <svg class="bgs" viewBox="0 0 683 384" preserveAspectRatio="none" aria-hidden="true"><defs><linearGradient id="pg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e0223f"/><stop offset="1" stop-color="#7d0c28"/></linearGradient></defs>
      <polygon points="0,0 280,0 232,384 0,384" fill="#12040b" opacity=".3"/><polygon points="0,0 260,0 212,384 0,384" fill="url(#pg)"/>
      <line x1="260" y1="0" x2="212" y2="384" stroke="#ffc46b" stroke-width="2" vector-effect="non-scaling-stroke"/><line x1="248" y1="0" x2="200" y2="384" stroke="#ffc46b" stroke-opacity=".35" stroke-width="1" vector-effect="non-scaling-stroke"/></svg>
    <h1 id="tt">A Date with Maya</h1><p id="tag">One evening. Two seats. Your move.</p>
    <div id="menu"><button data-a="new">New Game</button><button data-a="load">Load Game</button></div>
    <button class="ed" data-a="edit">Script editor</button>
  </div>
  <div id="panel"><h2 id="ph"></h2><div id="pbody"></div><div><button data-a="close">Close</button></div></div>
</div></div>
<input type="file" id="fi" accept="image/*" multiple hidden>
<script>
"use strict";
const $=s=>document.querySelector(s);
const store={get(k,d){try{const v=localStorage.getItem(k);return v==null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};

/* ---------- Demo story, written in the engine’s script language ---------- */
const DEMO=`# A Date with Maya — placeholder script (story in progress)
title A Date with Maya
char maya "Maya" #e0457b
bg cafe linear-gradient(#2a0505,#5c1111 65%,#a63a2a)

# --- IMAGES ---
# Sprite files live in the images folder next to this file (names are case-sensitive on GitHub Pages).
sprite maya default images/maya.png
sprite maya happy images/maya_happy.png
sprite maya menu images/maya_mm.png
# More expressions: sprite maya sad images/maya_sad.png   (or a template: sprites maya images/maya_{expr}.png)
# Image backgrounds work too: bg cafe images/cafe.jpg

label start
scene cafe
show maya center happy
maya: Hi! I’m Maya.
show maya center neutral
"The story isn’t finished yet. This is a placeholder scene."
"Open the script editor on the title screen to start writing it."
end
`;

/* ---------- Compiler ---------- */
let P=[],LAB={},CH={},BG={},META={title:"A Date with Maya",subtitle:""},SPR={},ASSETS={};
function compile(src){
  P=[];LAB={};CH={};BG={};SPR={};META={title:"Visual Novel",subtitle:""};
  let ch=null,m;
  src.split(/\r?\n/).forEach((raw,i)=>{
    const l=raw.trim(); if(!l||l[0]=="#")return;
    const bad=()=>{throw new Error("Line "+(i+1)+": "+l)};
    if(ch){
      if(l=="end"){P.push({t:"choice",o:ch});ch=null;return}
      m=l.match(/^"(.+?)"(?:\s+if\s+(.+?))?\s*->\s*(\w+)$/); if(!m)bad();
      ch.push({x:m[1],c:m[2],l:m[3]});return;
    }
    if(l=="choice"){ch=[];return}
    if(m=l.match(/^title\s+(.+)/)){META.title=m[1];return}
    if(m=l.match(/^subtitle\s+(.+)/)){META.subtitle=m[1];return}
    if(m=l.match(/^char\s+(\w+)\s+"(.+?)"\s+(#\w+)/)){CH[m[1]]={n:m[2],c:m[3]};return}
    if(m=l.match(/^bg\s+(\w+)\s+(.+)/)){BG[m[1]]=m[2];return}
    if(m=l.match(/^sprites\s+(\w+)\s+(\S+)/)){(SPR[m[1]]=SPR[m[1]]||{map:{}}).tpl=m[2];return}
    if(m=l.match(/^sprite\s+(\w+)\s+(\w+)\s+(\S+)/)){(SPR[m[1]]=SPR[m[1]]||{map:{}}).map[m[2]]=m[3];return}
    if(m=l.match(/^label\s+(\w+)/)){LAB[m[1]]=P.length;return}
    if(m=l.match(/^scene\s+(\w+)/)){P.push({t:"scene",b:m[1]});return}
    if(m=l.match(/^show\s+(\w+)(?:\s+(left|center|right))?(?:\s+(\w+))?/)){P.push({t:"show",id:m[1],p:m[2]||"center",e:m[3]||"neutral"});return}
    if(m=l.match(/^hide\s+(\w+)/)){P.push({t:"hide",id:m[1]});return}
    if(m=l.match(/^set\s+(\w+)\s*(=|\+=|-=)\s*(.+)/)){P.push({t:"set",v:m[1],o:m[2],e:m[3]});return}
    if(m=l.match(/^if\s+(.+?)\s+jump\s+(\w+)$/)){P.push({t:"if",c:m[1],l:m[2]});return}
    if(m=l.match(/^jump\s+(\w+)$/)){P.push({t:"jump",l:m[1]});return}
    if(m=l.match(/^music\s+(\w+)/)){P.push({t:"music",m:m[1]});return}
    if(l=="shake"||l=="flash"){P.push({t:l});return}
    if(l=="end"){P.push({t:"end"});return}
    if((m=l.match(/^(\w+):\s+(.+)/))&&CH[m[1]]){P.push({t:"say",w:m[1],x:m[2]});return}
    P.push({t:"say",w:null,x:l.replace(/^"|"$/g,"")});
  });
  P.forEach(p=>{
    const ls=p.o?p.o.map(o=>o.l):p.l?[p.l]:[];
    ls.forEach(x=>{if(!(x in LAB))throw new Error("Unknown label: "+x)});
  });
  if(!P.length)throw new Error("The script is empty.");
}

/* ---------- Mini expression evaluator (no eval) ---------- */
let S;
const val=t=>{t=t.trim();if(/^-?\d+(\.\d+)?$/.test(t))return+t;if(t=="true")return 1;if(t=="false")return 0;if(/^".*"$/.test(t))return t.slice(1,-1);return S.v[t]??0};
const cmp=s=>{const m=s.match(/^(.+?)\s*(==|!=|>=|<=|>|<)\s*(.+)$/);if(!m)return s.trim()[0]=="!"?!val(s.trim().slice(1)):!!val(s);
  const a=val(m[1]),b=val(m[3]);return{"==":a==b,"!=":a!=b,">=":a>=b,"<=":a<=b,">":a>b,"<":a<b}[m[2]]};
const ev=e=>e.split(/\s+or\s+/).some(o=>o.split(/\s+and\s+/).every(cmp));
const interp=t=>t.replace(/\{(\w+)\}/g,(_,k)=>S.v[k]??0);

/* ---------- Sprites (generated SVG so the engine needs no assets) ---------- */
/* ---------- Image assets & sprites ---------- */
const resolve=p=>ASSETS[p.split(/[\\/]/).pop()]||p;
const bgCss=v=>/^[^\s(]+\.(png|jpe?g|webp|gif|avif|svg)$/i.test(v)?`url("${resolve(v)}") center/cover no-repeat`:v.replace(/url\(["']?([^"')]+)["']?\)/,(_,p)=>`url("${resolve(p)}") center/cover no-repeat`);
function fillSprite(box,id,e){
  const c=SPR[id]||{map:{}},t=x=>c.tpl&&c.tpl.replace("{expr}",x);
  const L=[c.map[e],t(e),t("neutral"),c.map.neutral,c.map.default].filter(Boolean),vec=()=>{box.innerHTML="";const m=document.createElement("div");m.className="miss";m.append("Sprite missing");const sm=document.createElement("small");sm.textContent=(CH[id]?CH[id].n:id)+" · "+e;m.append(sm);box.appendChild(m)};
  if(!L.length)return vec();
  let i=0;const im=new Image();im.alt=CH[id]?CH[id].n:id;im.draggable=false;
  im.onerror=()=>{++i<L.length?im.src=resolve(L[i]):vec()};
  im.src=resolve(L[0]);box.innerHTML="";box.appendChild(im);
}
const idb=()=>new Promise((ok,no)=>{const r=indexedDB.open("maya_assets",1);r.onupgradeneeded=()=>r.result.createObjectStore("f");r.onsuccess=()=>ok(r.result);r.onerror=()=>no(r.error)});
async function saveAsset(f){ASSETS[f.name]=URL.createObjectURL(f);try{(await idb()).transaction("f","readwrite").objectStore("f").put(f,f.name)}catch(e){}}
async function loadAssets(){try{const d=await idb();await new Promise(ok=>{const q=d.transaction("f").objectStore("f").openCursor();q.onsuccess=()=>{const c=q.result;if(c){ASSETS[c.key]=URL.createObjectURL(c.value);c.continue()}else ok()};q.onerror=()=>ok()})}catch(e){}}
async function clearAssets(){Object.values(ASSETS).forEach(u=>URL.revokeObjectURL(u));ASSETS={};try{(await idb()).transaction("f","readwrite").objectStore("f").clear()}catch(e){}}
function listAssets(){const a=$("#al"),k=Object.keys(ASSETS);if(a)a.textContent=k.length?k.length+" image(s): "+k.join(", "):"No images added"}
function bokeh(){const b=$("#bk");if(b.children.length)return;
  for(let i=0;i<16;i++){const d=document.createElement("i"),z=3+Math.random()*7;
    d.style.cssText=`left:${Math.random()*100}%;top:${Math.random()*100}%;width:${z}cqw;height:${z}cqw;animation-delay:${-Math.random()*14}s;animation-duration:${12+Math.random()*10}s;--o:${.12+Math.random()*.22}`;b.appendChild(d)}}

/* ---------- Audio: tiny generative pads ---------- */
const Aud={ctx:null,timer:null,mode:"off",vol:store.get("maya_vol",.5),
  start(m){this.mode=m;clearInterval(this.timer);if(m=="off"||this.vol==0)return;
    try{this.ctx=this.ctx||new (window.AudioContext||window.webkitAudioContext)()}catch(e){return}
    const chords={calm:[[220,277,330],[196,247,294],[175,220,262],[196,247,330]],tense:[[110,131,165],[104,123,156]]}[m]||[];let i=0;
    const play=()=>{const c=this.ctx;if(!c||c.state=="closed")return;if(c.state=="suspended")c.resume();
      chords[i++%chords.length].forEach(f=>{const o=c.createOscillator(),g=c.createGain();o.type=m=="tense"?"sawtooth":"sine";o.frequency.value=f;
        const t=c.currentTime;g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(.05*this.vol*(m=="tense"?.5:1),t+1.2);g.gain.linearRampToValueAtTime(0,t+3.6);
        o.connect(g).connect(c.destination);o.start(t);o.stop(t+3.7)})};
    play();this.timer=setInterval(play,3200)}};

/* ---------- Engine ---------- */
let hist=[],cur=null,typing=null,auto=false,skip=false,autoT=null,flip=0,busy=false;
const clone=o=>JSON.parse(JSON.stringify(o));
const newState=()=>({pc:0,v:{},bg:null,sp:{},mu:"off",log:[]});

function renderScene(instant){
  const back=flip?$("#b2"):$("#b1"),front=flip?$("#b1"):$("#b2");
  const css=bgCss(BG[S.bg]||"#000");
  if(back.dataset.k!=S.bg||instant){front.style.background=css;front.dataset.k=S.bg;front.style.opacity=1;back.style.opacity=0;flip^=1}
  const box=$("#sprites"),old={};[...box.children].forEach(d=>old[d.dataset.id]=d);
  Object.entries(S.sp).forEach(([id,s])=>{let d=old[id];delete old[id];
    if(!d||d.dataset.e!=s.e){if(d)d.remove();d=document.createElement("div");d.className="sp";d.dataset.id=id;d.dataset.e=s.e;fillSprite(d,id,s.e);box.appendChild(d)}
    d.style.left={left:"20%",center:"50%",right:"80%"}[s.p]||"50%"});
  Object.values(old).forEach(d=>d.remove());
}
function snap(){hist.push(clone(S));if(hist.length>300)hist.shift()}

function run(){
  busy=false;$("#choices").innerHTML="";
  for(let guard=0;guard<5000;guard++){
    const p=P[S.pc];
    if(!p){return endGame()}
    switch(p.t){
      case"scene":S.bg=p.b;S.sp={};renderScene();S.pc++;break;
      case"show":S.sp[p.id]={p:p.p,e:p.e};renderScene();S.pc++;break;
      case"hide":delete S.sp[p.id];renderScene();S.pc++;break;
      case"set":{const a=S.v[p.v]??0,b=val(p.e);S.v[p.v]=p.o=="="?b:p.o=="+="?a+b:a-b;S.pc++;break}
      case"if":S.pc=ev(p.c)?LAB[p.l]:S.pc+1;break;
      case"jump":S.pc=LAB[p.l];break;
      case"music":S.mu=p.m;Aud.start(p.m);S.pc++;break;
      case"shake":{const s=$("#stage");s.classList.remove("shake");void s.offsetWidth;s.classList.add("shake");S.pc++;break}
      case"flash":{const f=$("#fx");f.classList.remove("go");void f.offsetWidth;f.classList.add("go");S.pc++;break}
      case"say":snap();return say(p);
      case"choice":snap();return choose(p);
      case"end":return endGame();
    }
  }
}
function say(p){
  const txt=interp(p.x),who=p.w?CH[p.w].n:"";
  $("#box").style.display="block";$("#name").style.display=who?"block":"none";$("#name").textContent=who;$("#name").style.background=p.w?CH[p.w].c:"";
  $("#next").style.visibility="hidden";
  S.log.push({w:who,x:txt});cur={txt};
  let n=0;const el=$("#text");el.textContent="";
  const spd=store.get("maya_spd",30);
  clearInterval(typing);
  const done=()=>{clearInterval(typing);typing=null;el.textContent=txt;$("#next").style.visibility="visible";
    if(auto||skip){clearTimeout(autoT);autoT=setTimeout(()=>{if(auto||skip)advance()},skip?70:900+txt.length*45)}};
  if(skip||spd==0)return done();
  typing=setInterval(()=>{n++;el.textContent=txt.slice(0,n);if(n>=txt.length)done()},1000/spd*1.6);
}
function choose(p){
  skip=false;sync();clearTimeout(autoT);
  $("#box").style.display="none";busy=true;
  const box=$("#choices");box.innerHTML="";let k=0;
  p.o.forEach(o=>{if(o.c&&!ev(o.c))return;k++;const b=document.createElement("button");b.innerHTML="<i>"+k+"</i>";b.append(document.createTextNode(interp(o.x)));
    b.onclick=e=>{e.stopPropagation();S.pc=LAB[o.l];run()};b.dataset.k=k;box.appendChild(b)});
}
function advance(){
  if(busy)return;
  if(typing){clearInterval(typing);typing=null;$("#text").textContent=cur.txt;$("#next").style.visibility="visible";
    if(auto){clearTimeout(autoT);autoT=setTimeout(advance,900+cur.txt.length*45)}return}
  clearTimeout(autoT);S.pc++;run();
}
function rollback(){
  if(hist.length<2)return;hist.pop();S=hist.pop();renderScene(true);Aud.start(S.mu);run();
}
function endGame(){
  auto=skip=false;sync();clearTimeout(autoT);busy=true;
  $("#box").style.display="none";$("#choices").innerHTML="";
  const b=document.createElement("button");b.textContent="The end — back to title";b.onclick=e=>{e.stopPropagation();toTitle()};$("#choices").appendChild(b);
}
function sync(){$("#bauto").classList.toggle("on",auto);$("#bskip").classList.toggle("on",skip)}
function startGame(st){
  $("#title").style.display="none";$("#hud").style.display="flex";
  S=st||newState();hist=[];renderScene(true);Aud.start(S.mu);run();
}
function toTitle(){
  auto=skip=false;sync();clearTimeout(autoT);clearInterval(typing);Aud.start("off");
  $("#title").style.display="block";$("#hud").style.display="none";$("#box").style.display="none";$("#choices").innerHTML="";$("#sprites").innerHTML="";
  $("#tt").textContent=META.title;fillSprite($("#art"),CH.maya?"maya":Object.keys(CH)[0],"menu");bokeh();document.title=META.title;
  $("#b1").style.opacity=0;$("#b2").style.opacity=0;$("#b1").dataset.k="";$("#b2").dataset.k="";
}

/* ---------- Panels ---------- */
function panel(title,html){$("#pbody").style.display="";$("#ph").textContent=title;$("#pbody").innerHTML=html;$("#panel").classList.add("open")}
function closePanel(){$("#panel").classList.remove("open")}
const esc=s=>s.replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
function slots(mode){
  const sv=store.get("maya_saves",{});let h="";
  for(let i=1;i<=6;i++){const s=sv[i];
    h+=`<button class="slot" data-slot="${i}" data-mode="${mode}">Slot ${i}: ${s?esc(s.when+" — "+s.line):"empty"}</button>`}
  panel(mode=="save"?"Save game":"Load game",h);
}
function showLog(){panel("Backlog",S.log.map(l=>`<p>${l.w?"<b>"+esc(l.w)+"</b> ":""}${esc(l.x)}</p>`).join("")||"<p>Nothing yet.</p>");const b=$("#pbody");b.scrollTop=b.scrollHeight}
function settings(){
  panel("Settings",`<label class="r">Text speed <input type="range" id="sp" min="0" max="80" value="${store.get("maya_spd",30)}"> <span>0 shows text instantly</span></label>
  <label class="r">Music volume <input type="range" id="vo" min="0" max="100" value="${Aud.vol*100}"></label>
  <p>Keys: Space, Enter or click to advance. Backspace or wheel up rolls back. 1–4 picks a choice. A toggles auto, S toggles skip, L opens the log.</p>`);
  $("#sp").oninput=e=>store.set("maya_spd",+e.target.value);
  $("#vo").oninput=e=>{Aud.vol=e.target.value/100;store.set("maya_vol",Aud.vol);if(Aud.mode!="off")Aud.start(Aud.mode)};
}
function editor(){
  panel("Script editor",`<textarea id="src" spellcheck="false"></textarea>`);
  $("#src").value=store.get("maya_script",DEMO);listAssets();
  $("#pbody").style.display="flex";
  const h=$("#panel>div:last-child");
  if(!$("#runb")){h.insertAdjacentHTML("afterbegin",`<button id="runb" data-a="run">Run script</button> <button id="rstb" data-a="reset">Reset to demo</button> <button data-a="img">Add images</button> <button data-a="clr">Clear images</button> <span id="al"></span> <span id="err"></span> `)}
}
function loadScript(src,save){
  try{compile(src);if(save)store.set("maya_script",src);$("#err").textContent="";toTitle();return true}
  catch(e){const el=$("#err");if(el)el.textContent=e.message;return false}
}

/* ---------- Wiring ---------- */
document.addEventListener("click",e=>{
  const a=e.target.closest("[data-a]"),sl=e.target.closest("[data-slot]");
  if(sl){const i=sl.dataset.slot,sv=store.get("maya_saves",{});
    if(sl.dataset.mode=="save"){const st=hist[hist.length-1];if(!st)return;
      sv[i]={st,when:new Date().toLocaleString(),line:(S.log.length?S.log[S.log.length-1].x:"").slice(0,48)};store.set("maya_saves",sv);slots("save")}
    else if(sv[i]){closePanel();clearInterval(typing);startGame(clone(sv[i].st))}
    return}
  if(a){e.stopPropagation();const k=a.dataset.a;
    ({back:rollback,log:showLog,auto(){auto=!auto;skip=false;sync();if(auto&&!typing)advance()},skip(){skip=!skip;auto=false;sync();if(skip&&!typing)advance()},
     save(){slots("save")},load(){slots("load")},set:settings,quit:toTitle,close:closePanel,
     new(){startGame()},cont(){const sv=store.get("maya_saves",{}),l=Object.values(sv).sort((x,y)=>new Date(y.when)-new Date(x.when))[0];if(l)startGame(clone(l.st));else slots("load")},
     edit:editor,img(){$("#fi").click()},clr(){clearAssets().then(()=>{listAssets();toTitle()})},run(){if(loadScript($("#src").value,true))closePanel()},reset(){$("#src").value=DEMO;if(loadScript(DEMO,true))closePanel()}})[k]();
    return}
  if(e.target.closest("#box")||e.target.id=="stage"||e.target.closest("#sprites")||e.target.classList.contains("bg")){
    if($("#title").style.display!="none"||$("#panel").classList.contains("open"))return;
    auto=skip=false;sync();advance()}
});
document.addEventListener("keydown",e=>{
  if(e.target.tagName=="TEXTAREA"||e.target.tagName=="INPUT")return;
  const open=$("#panel").classList.contains("open"),inGame=$("#title").style.display=="none";
  if(e.key=="Escape"){open?closePanel():inGame&&settings();return}
  if(!inGame||open)return;
  if(e.key==" "||e.key=="Enter"){e.preventDefault();auto=skip=false;sync();advance()}
  else if(e.key=="Backspace"||e.key=="ArrowLeft")rollback();
  else if(e.key=="a"||e.key=="A")$("#bauto").click();
  else if(e.key=="s"||e.key=="S")$("#bskip").click();
  else if(e.key=="l"||e.key=="L")showLog();
  else if(/^[1-4]$/.test(e.key)){const b=document.querySelector('#choices button[data-k="'+e.key+'"]');b&&b.click()}
});
document.addEventListener("wheel",e=>{if(e.deltaY<0&&$("#title").style.display=="none"&&!$("#panel").classList.contains("open"))rollback()},{passive:true});

$("#fi").addEventListener("change",async e=>{for(const f of e.target.files)await saveAsset(f);e.target.value="";listAssets();if($("#title").style.display!="none")toTitle()});
if(!loadScript(store.get("maya_script",DEMO),false))loadScript(DEMO,false);
loadAssets().then(()=>{if($("#title").style.display!="none")toTitle()});
</script>
</body>
</html>
